<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="./src/data/img/tom.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Theo (Thai) Tran - Software Developer and legal owner of oo1 studio. Specializing in Android, Go, and TypeScript."
        />
        <meta property="og:title" content="Theo Tran | Software Developer" />
        <meta
            property="og:description"
            content="The personal hub and digital business card of Theo Tran, the legal owner of oo1 studio."
        />
        <meta
            property="og:image"
            content="https://theo.oo1.studio/src/data/img/tom.svg"
        />
        <title>Theo</title>
        <link rel="stylesheet" href="https://core.oo1.studio/outsync.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <script type="module" src="/src/main.ts" defer></script>
    </head>
    <!-- 1. Added `min-h-screen flex flex-col` to body so it stretches to the bottom of the window -->
    <body
        class="font-['Courier_Prime',monospace] bg-white text-black dark:bg-black dark:text-white min-h-dvh flex flex-col"
    >
        <!-- 2. Added `flex-1` to main so it fills the body (respecting your padding margin) -->
        <main class="flex-1 flex flex-col m-(--padding) gap-(--padding)">
            <div
                style="--layer: 1"
                class="text-white min-h-(--layer-height) rounded-(--layer-corner-radius) flex flex-row justify-between gap-(--padding)"
            >
                <div>
                    <div
                        style="--layer: 1"
                        class="bg-black text-white dark:bg-white dark:text-black min-h-(--layer-height) rounded-(--layer-corner-radius) p-(--padding) px-(--layer-corner-radius) flex justify-center items-center"
                    >
                        Theo (Thai) Tran <br />
                        dev @ Regina, SK
                    </div>
                </div>

                <img
                    style="--layer: 1"
                    src="./src/data/img/tom.svg"
                    alt="tom"
                    class="max-h-(--layer-height)"
                />
            </div>

            <div
                class="flex-1 flex text-justify justify-center p-(--padding) items-center text-lg md:text-xl leading-relaxed"
            >
                <div>
                    I'm the owner of
                    <a
                        href="https://oo1.studio"
                        target="_blank"
                        class="inline-flex items-center gap-1.5 px-3 py-1 mx-1 bg-(--highlight-color) text-(--highlight-contrast-color) font-bold rounded hover:scale-110 active:scale-95 transition-all group shadow-lg"
                    >
                        oo1 studio
                        <span
                            class="group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform text-base leading-none"
                            >↗</span
                        > </a
                    >. All of my independent software projects are published
                    under the name of oo1. I'm currently focusing on Android and
                    Web Development, with a little bit of C.
                </div>
            </div>

            <div
                id="bottom-panel"
                class="flex flex-row w-full gap-(--padding) justify-between"
            >
                <div
                    class="portrait:flex-1 rounded-(--layer-corner-radius) flex flex-col gap-(--padding)"
                >
                    <div class="flex-1"></div>
                    <!--<a
                        href="https://oo1.studio"
                        target="_blank"
                        style="--layer: 1"
                        class="flex-1 flex items-center justify-center rounded-(--layer-corner-radius) text-(--highlight-contrast-color) border-2 border-transparent hover:border-(--highlight-color) bg-(--highlight-color) hover:bg-(--highlight-contrast-color) dark:hover:bg-white hover:text-(--highlight-color) transition-colors group p-(--padding)"
                    >
                        <div
                            class="text-base sm:text-xl uppercase tracking-widest font-bold flex items-center gap-2 group-hover:scale-110 transition-transform"
                        >
                            See my projects
                            <span
                                class="group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"
                                >↗</span
                            >
                        </div>
                    </a>-->
                    <div
                        id="contact"
                        style="--layer: 1"
                        class="box-border flex flex-col landscape:flex-row justify-around gap-(--padding) border-black dark:border-white border-dashed border-2 p-(--padding) min-h-(--layer-height) rounded-(--layer-corner-radius)"
                    >
                        <a
                            href="mailto:mailoftheo@gmail.com"
                            style="--layer: 2"
                            class="h-(--layer-height) rounded-(--layer-corner-radius) px-(--padding) flex justify-center items-center hover:opacity-75 transition-opacity"
                        >
                            mailoftheo@gmail.com
                        </a>
                        <div
                            class="flex flex-row justify-around gap-(--padding)"
                        >
                            <a
                                href="https://linkedin.com/in/theothaitran"
                                target="_blank"
                                style="--layer: 2"
                                class="flex-1 h-(--layer-height) rounded-(--layer-corner-radius) px-(--padding) flex justify-center items-center hover:opacity-75 transition-opacity border-black dark:border-white border-dashed border-2"
                            >
                                LinkedIn
                            </a>
                            <a
                                href="https://github.com/marcinlowercase"
                                target="_blank"
                                style="--layer: 2"
                                class="flex-1 h-(--layer-height) rounded-(--layer-corner-radius) px-(--padding) flex justify-center items-center hover:opacity-75 transition-opacity border-black dark:border-white border-dashed border-2"
                            >
                                GitHub
                            </a>
                        </div>
                    </div>
                </div>
                <div
                    style="--layer: 1"
                    class="flex flex-row [@media(max-height:750px)_and_(orientation:landscape)]:flex-col items-center gap-(--padding) bg-black dark:bg-white text-white dark:text-black rounded-(--layer-corner-radius) p-(--padding)"
                >
                    <div
                        style="--layer: 2"
                        class="mx-(--layer-corner-radius) flex-1 flex flex-row justify-center items-center [writing-mode:vertical-rl] [@media(max-height:750px)_and_(orientation:landscape)]:[writing-mode:horizontal-tb] rotate-180 [@media(max-height:750px)_and_(orientation:landscape)]:rotate-0 text-sm pt-(--padding) [@media(max-height:750px)_and_(orientation:landscape)]:pt-0"
                    >
                        tech I currently use
                    </div>
                    <div
                        id="tech"
                        style="--layer: 2"
                        class="flex flex-col [@media(max-height:750px)_and_(orientation:landscape)]:flex-row bg-black w-(--layer-height)[@media(max-height:750px)_and_(orientation:landscape)]:w-full h-auto[@media(max-height:750px)_and_(orientation:landscape)]:h-(--layer-height) rounded-(--layer-corner-radius) p-(--padding) justify-around gap-(--padding) overflow-auto"
                    >
                        <img
                            style="--layer: 3"
                            src="./src/data/img/android.svg"
                            alt="Android icon"
                            class="max-h-(--layer-height) flex-1"
                        />
                        <img
                            style="--layer: 3"
                            src="./src/data/img/typescript.svg"
                            alt="TypeScript icon"
                            class="max-h-(--layer-height) flex-1"
                        />
                        <img
                            style="--layer: 3"
                            src="./src/data/img/tailwindcss.svg"
                            alt="Tailwind CSS icon"
                            class="max-h-(--layer-height) flex-1"
                        />
                        <img
                            style="--layer: 3"
                            src="./src/data/img/go.svg"
                            alt="Go icon"
                            class="max-h-(--layer-height) flex-1"
                        />
                        <img
                            style="--layer: 3"
                            src="./src/data/img/deno.svg"
                            alt="Deno icon"
                            class="max-h-(--layer-height) flex-1"
                        />
                        <img
                            style="--layer: 3"
                            src="./src/data/img/c.svg"
                            alt="C icon"
                            class="max-h-(--layer-height) flex-1"
                        />
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
